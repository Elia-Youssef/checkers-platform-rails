# SQLite in every environment (TASK-BRIEF.md section 1). The development image installs the
# sqlite3 CLI and headers; the sqlite3 gem is pinned in the Gemfile.
#
# Every environment has a second database, `cable`, because Action Cable runs on Solid Cable
# everywhere (config/cable.yml). Its schema is db/cable_schema.rb, which bin/rails db:prepare
# loads the first time the database is created. Production adds the Solid Cache and Solid
# Queue databases as well; development and test keep the memory cache store and the async
# queue adapter that Rails configures for them.
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  primary:
    <<: *default
    database: storage/development.sqlite3
  cable:
    <<: *default
    database: storage/development_cable.sqlite3
    migrations_paths: db/cable_migrate

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  primary:
    <<: *default
    database: storage/test.sqlite3
  cable:
    <<: *default
    database: storage/test_cable.sqlite3
    migrations_paths: db/cable_migrate

# Store production database in the storage/ directory, which by default
# is mounted as a persistent Docker volume in config/deploy.yml.
production:
  primary:
    <<: *default
    database: storage/production.sqlite3
  cache:
    <<: *default
    database: storage/production_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: storage/production_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: storage/production_cable.sqlite3
    migrations_paths: db/cable_migrate
