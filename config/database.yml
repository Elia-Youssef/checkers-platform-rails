# SQLite in every environment (TASK-BRIEF.md section 1). The development image installs the
# sqlite3 CLI and headers; the sqlite3 gem is pinned in the Gemfile.
#
# Every environment has a second database, `cable`, because Action Cable runs on Solid Cable
# everywhere (config/cable.yml). Its schema is db/cable_schema.rb, which bin/rails db:prepare
# loads the first time the database is created.
#
# Development has a third, `cache`, because the development server runs two Puma workers
# (WEB_CONCURRENCY in compose.yaml) and the sign-in rate limit counts in Rails.cache: a
# per-process memory store would give each worker its own counters. Its schema is
# db/cache_schema.rb, loaded the same way. Production adds `cache` and `queue`. Test keeps the
# memory cache store, which is what its single-process suite needs, and the async queue
# adapter Rails configures for it.
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  primary:
    <<: *default
    database: storage/development.sqlite3
  # Solid Cache in development as well as in production, because the development server now
  # runs more than one Puma worker and a per-process memory store would give each worker its
  # own copy of the sign-in rate limit's counters.
  cache:
    <<: *default
    database: storage/development_cache.sqlite3
    migrations_paths: db/cache_migrate
  cable:
    <<: *default
    database: storage/development_cable.sqlite3
    migrations_paths: db/cable_migrate

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  primary:
    <<: *default
    database: storage/test.sqlite3
  cable:
    <<: *default
    database: storage/test_cable.sqlite3
    migrations_paths: db/cable_migrate

# Store production database in the storage/ directory, which by default
# is mounted as a persistent Docker volume in config/deploy.yml.
production:
  primary:
    <<: *default
    database: storage/production.sqlite3
  cache:
    <<: *default
    database: storage/production_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: storage/production_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: storage/production_cable.sqlite3
    migrations_paths: db/cable_migrate
