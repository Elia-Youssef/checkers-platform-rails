# Development environment for the Checkers Rails application.
# Run every command from this directory (project/), which is also the Rails root.
#
#   docker compose build web                     build the image
#   docker compose run --rm web <command>        run one command inside the container
#   docker compose up                            start the app once it exists (phase 3 onward)
#   docker compose down -v                       stop and reset the gem volume

# An explicit project name keeps the container, network and gem volume namespaced as
# checkers-ruby_* instead of taking their name from the parent directory.
name: checkers-ruby

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: checkers-ruby-dev
    working_dir: /app
    volumes:
      # The Rails root itself is bind mounted, so an edit on the host is live in the container.
      - .:/app
      # Installed gems live in a named volume so that bundle install survives container
      # recreation, and bin/bundler-audit caches its clone of ruby-advisory-db inside it at
      # /usr/local/bundle/ruby-advisory-db (BUNDLER_AUDIT_DB below), so the gem audit neither
      # re-downloads the advisory database on every run nor needs the network once it has been
      # fetched once. Docker seeds an empty named volume from the image's own directory the
      # first time it is used, so the rails 8.1.3.1 gem baked into the image is there from the
      # start. After a rebuild that changes baked in gems, run `docker compose down -v` to drop
      # this volume so it is seeded again from the new image (the advisory database goes with it
      # and the next online run fetches it again).
      - bundle:/usr/local/bundle
      # tmp/ and log/ are written constantly (the bootsnap compile cache, the Puma pid,
      # Rails logs) and every write through the Windows bind mount costs. Keeping them in
      # named volumes takes them off the host filesystem: measured over a full bin/ci this is
      # the difference between about three minutes and about forty seconds, and it also keeps
      # the working copy free of tmp and log contents.
      - tmp:/app/tmp
      - log:/app/log
      # The SQLite databases, for the same reason and one more: the working copy then never
      # holds a database file. `docker compose down -v` resets them along with the gems.
      - storage:/app/storage
    environment:
      # Where bin/bundler-audit keeps its copy of ruby-advisory-db. Inside the bundle volume,
      # so it persists across `docker compose run --rm` and across `docker compose up`.
      BUNDLER_AUDIT_DB: /usr/local/bundle/ruby-advisory-db
      # Docker Desktop on Windows does not deliver inotify events for files edited on the host,
      # so the development file watcher polls from its own thread instead of listening for
      # events that never arrive. See config/initializers/file_watching.rb. On a host whose
      # bind mounts do propagate inotify, delete this line and reloading gets faster still.
      LISTEN_FORCE_POLLING: "1"
      # Puma worker processes. MRI holds one global VM lock per process, so a Hard search,
      # which is a pure-Ruby loop of a second or two, stops every other request in its
      # process: measured at 2.1 to 2.2 s of waiting for requests that take 0.02 s on an idle
      # server. Two workers means a search in one leaves the other serving. Puma reads this
      # variable itself (puma/configuration.rb), so config/puma.rb needs nothing added.
      WEB_CONCURRENCY: "2"
    ports:
      # The port on the host, 3000 unless CHECKERS_PORT says otherwise:
      #   CHECKERS_PORT=3100 docker compose up
      # The container always listens on 3000, so every command in the README is unchanged and
      # only the address in the browser moves. A reviewer whose 3000 is already taken needs
      # this and must not have to edit a tracked file to get it (round-1 audit, finding M3).
      - "${CHECKERS_PORT:-3000}:3000"
    # Headless Chromium exhausts the default 64 MB /dev/shm and crashes mid test.
    shm_size: 1gb
    # Keep a TTY so that `docker compose run` is usable interactively (bin/rails console,
    # a debugger breakpoint, a shell).
    stdin_open: true
    tty: true
    # `docker compose up` installs any missing gems, creates and migrates the SQLite
    # databases (the primary one and the Solid Cable one), clears a pid file left behind by
    # a container that was killed, and starts the server on http://localhost:3000.
    # `docker compose run --rm web <command>` replaces this command with <command>.
    command: bash -c "(bundle check || bundle install) && bin/rails db:prepare && rm -f tmp/pids/server.pid && bin/rails server -b 0.0.0.0 -p 3000"

volumes:
  bundle:
  tmp:
  log:
  storage:
